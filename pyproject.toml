[project]
name = "job-rec-agent"
version = "1.0.0"
description = "AI-powered job recommendation agent that finds, verifies, and ranks software engineering jobs based on a user's resume."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.11,<3",
  "langgraph>=0.6,<2",
  "langchain-core>=1.5.5,<2",
  "langchain>=1.4.0",
  "python-dotenv>=1,<2",
  "langchain-openrouter>=0.2.8,<1",
  "pypdf>=6.17.0",
  "firecrawl>=4.41.0",
  "markdown>=3.10.3",
  "langchain-google-genai>=4.4.0",
  "resend>=2.43.0",
  "crawl4ai>=0.9.3",
]

[dependency-groups]
web = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]
